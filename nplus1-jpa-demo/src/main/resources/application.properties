spring.application.name=nplus1-jpa-demo

# --- Database: H2 in-memory, otomatis dibuat tiap aplikasi jalan ---
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Matikan open-in-view supaya lazy loading cuma bisa terjadi di dalam service.
# Ini bikin masalah N+1 lebih gampang dilacak.
spring.jpa.open-in-view=false

# --- Biar semua SQL kelihatan di console ---
logging.level.org.hibernate.SQL=DEBUG

# --- Penghitung query (lihat config/QueryCounter.java) ---
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.codejar.nplusone.config.QueryCounter

# --- Data contoh ---
demo.order-count=100
demo.items-per-order=3

# Di project beneran, batch fetching biasanya dinyalakan global seperti ini.
# Di demo ini sengaja TIDAK dinyalakan supaya endpoint /n-plus-one tetap
# menunjukkan masalah aslinya. Lihat OrderService.batchFetch().
# spring.jpa.properties.hibernate.default_batch_fetch_size=50
